<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --fond:#f6f6fa; --papier:#ffffff; --encre:#2b2a3d; --doux:#5f5d74; --pale:#8e8ca3;
  --trait:#e3e1ee; --accent:#6c5ce7; --accent-fond:#efedfd; --accent-encre:#4a3fc4;
  --ok:#1f9d63; --ok-fond:#e6f6ee; --alerte:#b86a00; --alerte-fond:#fff3e0; --danger:#c62f45; --danger-fond:#fdecee;
  --ombre:0 1px 2px rgba(43,42,61,.06),0 6px 24px rgba(43,42,61,.06);
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --fond:#15141f; --papier:#1d1c2a; --encre:#e9e8f3; --doux:#b3b1c7; --pale:#8a88a1;
  --trait:#2f2d42; --accent:#9d93ff; --accent-fond:#2a2650; --accent-encre:#c4beff;
  --ok:#4fd495; --ok-fond:#163427; --alerte:#ffb85c; --alerte-fond:#3a2a12; --danger:#ff7d8f; --danger-fond:#3d1a21;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fond:#15141f; --papier:#1d1c2a; --encre:#e9e8f3; --doux:#b3b1c7; --pale:#8a88a1;
  --trait:#2f2d42; --accent:#9d93ff; --accent-fond:#2a2650; --accent-encre:#c4beff;
  --ok:#4fd495; --ok-fond:#163427; --alerte:#ffb85c; --alerte-fond:#3a2a12; --danger:#ff7d8f; --danger-fond:#3d1a21;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--fond);color:var(--encre);font-family:var(--sans);font-size:15.5px;line-height:1.65;padding-inline:16px;padding-block:0 64px}
.cadre{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:40px}
@media (min-width:1080px){.cadre{grid-template-columns:250px minmax(0,1fr)}}

/* En-tête */
.entete{padding-block:48px 28px;border-bottom:1px solid var(--trait);max-width:1180px;margin:0 auto 32px}
.surtitre{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,4.2vw,44px);line-height:1.1;margin:10px 0 14px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.chapeau{max-width:68ch;color:var(--doux);font-size:17px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:13px;color:var(--doux)}
.meta b{color:var(--encre);font-weight:600}

/* Sommaire */
nav.sommaire{font-size:13.5px}
@media (min-width:1080px){nav.sommaire{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}}
nav.sommaire h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pale);margin:0 0 10px;font-weight:700}
nav.sommaire ol{list-style:none;margin:0;padding:0;counter-reset:s}
nav.sommaire>ol>li{counter-increment:s;margin-bottom:6px}
nav.sommaire>ol>li>a{font-weight:600}
nav.sommaire>ol>li>a::before{content:counter(s) ". ";color:var(--pale);font-variant-numeric:tabular-nums}
nav.sommaire ol ol{margin:4px 0 8px 14px;border-left:1px solid var(--trait);padding-left:10px}
nav.sommaire ol ol li{margin:2px 0}
nav.sommaire a{color:var(--doux);text-decoration:none;display:block;padding:2px 0}
nav.sommaire a:hover,nav.sommaire a:focus-visible{color:var(--accent-encre)}

/* Contenu */
main{min-width:0}
section.chapitre{margin-bottom:64px}
h2.titre{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.015em;display:flex;gap:12px;align-items:baseline;text-wrap:balance}
h2.titre .num{font-family:var(--mono);font-size:15px;color:var(--accent);font-weight:500}
.intro{color:var(--doux);max-width:70ch;margin:0 0 24px}
h3{font-size:20px;margin:40px 0 8px;font-weight:700;text-wrap:balance}
h4{font-size:16px;margin:26px 0 6px;font-weight:700}
p,li{max-width:72ch}
a{color:var(--accent-encre)}
ul,ol{padding-left:22px}
li{margin:3px 0}
code,.code{font-family:var(--mono);font-size:.88em;background:var(--accent-fond);color:var(--accent-encre);padding:1px 6px;border-radius:5px;white-space:nowrap}
.btn{display:inline-block;font-size:.85em;font-weight:600;border:1px solid var(--trait);background:var(--papier);border-radius:6px;padding:0 7px;white-space:nowrap;color:var(--encre)}
.chemin{font-size:13.5px;color:var(--doux);margin:0 0 14px}
.chemin b{color:var(--encre);font-weight:600}

figure{margin:18px 0 26px;background:var(--papier);border:1px solid var(--trait);border-radius:12px;box-shadow:var(--ombre);overflow:hidden}
figure button.zoom{all:unset;display:block;cursor:zoom-in;width:100%}
figure button.zoom:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
figure img{display:block;width:100%;height:auto;max-width:100%}
figure.haute img{max-height:720px;object-fit:cover;object-position:top}
figure.moyenne{max-width:720px}
figcaption{font-size:13px;color:var(--doux);padding:10px 14px;border-top:1px solid var(--trait)}
figcaption b{color:var(--encre)}

.note{border-radius:10px;padding:12px 16px;margin:18px 0;font-size:14.5px;max-width:78ch;border:1px solid transparent}
.note b:first-child{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.note.info{background:var(--accent-fond);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.note.info b:first-child{color:var(--accent-encre)}
.note.attention{background:var(--alerte-fond);border-color:color-mix(in srgb,var(--alerte) 30%,transparent)}
.note.attention b:first-child{color:var(--alerte)}
.note.export{background:var(--ok-fond);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.note.export b:first-child{color:var(--ok)}

.tableau{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--trait);border-radius:10px;background:var(--papier)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--trait);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pale);font-weight:700;background:color-mix(in srgb,var(--accent-fond) 40%,var(--papier))}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}

.pastille{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px}
.p-ok{background:var(--ok-fond);color:var(--ok)}
.p-en-cours{background:var(--accent-fond);color:var(--accent-encre)}
.p-echec{background:var(--danger-fond);color:var(--danger)}
.p-neutre{background:var(--trait);color:var(--doux)}
.p-alerte{background:var(--alerte-fond);color:var(--alerte)}

.menu-arbre{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0 24px}
.menu-arbre div{background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:12px 16px}
.menu-arbre h5{margin:0 0 6px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pale)}
.menu-arbre ul{margin:0;padding-left:16px;font-size:14px}
.menu-arbre li{margin:2px 0}
.menu-arbre a{text-decoration:none}

.onglets-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0 20px}
.onglets-grille div{border:1px solid var(--trait);border-radius:10px;padding:10px 14px;background:var(--papier);font-size:14px}
.onglets-grille b{display:block;margin-bottom:2px}

dialog#loupe{border:0;padding:0;background:transparent;max-width:min(1500px,96vw);max-height:94vh;overflow:auto}
dialog#loupe::backdrop{background:rgba(15,14,24,.82)}
dialog#loupe img{display:block;max-width:100%;height:auto;border-radius:8px}
dialog#loupe form{position:sticky;top:0;display:flex;justify-content:flex-end}
dialog#loupe button{font:600 13px var(--sans);background:var(--papier);color:var(--encre);border:1px solid var(--trait);border-radius:8px;padding:6px 12px;margin:8px;cursor:pointer}
footer{max-width:1180px;margin:32px auto 0;padding-top:20px;border-top:1px solid var(--trait);font-size:13px;color:var(--pale)}

/* Export PDF (impression) : palette claire, une colonne, captures entières. */
@page{size:A4;margin:14mm 12mm}
@media print{
  :root:not(#_){
    color-scheme:light;
    --fond:#ffffff; --papier:#ffffff; --encre:#1f1e2c; --doux:#4b4960; --pale:#77758c;
    --trait:#dcdae8; --accent:#5a4bd8; --accent-fond:#f0eefc; --accent-encre:#3f33b8;
    --ok:#157a4b; --ok-fond:#e8f5ee; --alerte:#8a5200; --alerte-fond:#fdf3e3; --danger:#a8263a; --danger-fond:#fbeaec;
    --ombre:none;
  }
  body{padding:0;font-size:11pt;line-height:1.5}
  .cadre{display:block}
  nav.sommaire,dialog#loupe{display:none}
  .entete{padding-block:0 12pt;margin-bottom:16pt}
  section.chapitre{break-before:page;margin-bottom:0}
  h2,h3,h4{break-after:avoid}
  figure{break-inside:avoid;box-shadow:none}
  figure.haute img{max-height:none;object-fit:fill}
  figure button.zoom{cursor:default}
  .note,.tableau,.onglets-grille div,.menu-arbre div{break-inside:avoid}
  a{color:inherit;text-decoration:none}
  p,li{max-width:none}
}
</style>
